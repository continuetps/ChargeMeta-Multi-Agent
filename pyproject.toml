[project]
name = "chargemeta-agent"
version = "0.1.0"
description = "新能源充电网络数据资产智能盘点系统"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0",
  "pydantic-settings>=2.5", "httpx>=0.27", "aiosqlite>=0.20",
  "langgraph>=0.6", "celery[redis]>=5.4", "redis>=5.2",
  "psycopg[binary]>=3.2", "pgvector>=0.3", "numpy>=2.0",
  "structlog>=24.4", "alembic>=1.14", "pyyaml>=6.0"
]

[project.optional-dependencies]
postgres = []
mysql = ["pymysql>=1.1"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["chargemeta*"]
exclude = ["web*", "tests*", "scripts*"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["B008", "BLE001", "DTZ003"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
